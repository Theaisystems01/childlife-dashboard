# Reverse proxy for the ChildLife reporting dashboard.
#
# Serves the built frontend and the API under ONE hostname. That makes them
# same-origin, so CORS never applies and CORS_ORIGINS in backend/.env can stay
# empty. Split them across two hostnames and you must list the frontend's origin
# there instead.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/childlife
#   sudo ln -s /etc/nginx/sites-available/childlife /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name childlife.example.com;   # <-- your hostname

    # Everything here is patient data. Terminate TLS and drop this redirect in
    # only once certbot has issued a certificate.
    # return 301 https://$host$request_uri;

    root /home/mahausmani/projects/childlife-reporting/frontend/dist;
    index index.html;

    # Built SPA. Any unknown path falls back to index.html so client-side state
    # survives a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;

        # uvicorn runs with --proxy-headers, so it trusts these for the client IP
        # and scheme rather than reporting every request as coming from nginx.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The Excel export streams and can take a while on a large date range.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # The export sets its own Content-Disposition; don't let nginx rewrite it.
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}

# After TLS is issued:
#
# server {
#     listen 443 ssl http2;
#     server_name childlife.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/childlife.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/childlife.example.com/privkey.pem;
#
#     add_header Strict-Transport-Security "max-age=31536000" always;
#     ... same root / location blocks as above ...
# }
